[project]
name = "inaturalist-clumper"
version = "0.1"
description = "Group iNaturalist sightings into clumps by space and time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
inaturalist-clumper = "inaturalist_clumper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inaturalist_clumper"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
